name: BADOL-TG-BOT 2.0 CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # প্রতি ৩০ মিনিট পর পর অ্যাকশনটি ট্রিগার হবে যেন প্রজেক্ট ঘুমিয়ে না পড়ে
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Start Bot Checking or Keep Alive
      run: |
        echo "BADOL-TG-BOT workflow check running successfully..."
        node -e "console.log('Environment check passed.')"
